name: Pillownote
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Pillownote:
    type: application
    platform: iOS
    sources:
      - path: Pillownote
      - path: Shared
    dependencies:
      - target: PillownoteWidgets
    entitlements:
      path: Pillownote/Pillownote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzoutuo.Pillownote
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zzoutuo.Pillownote
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Pillownote
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pillownote
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Pillownote uses the microphone to record voice notes for your partner."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Pillownote transcribes your voice notes so they can be read as text."
        INFOPLIST_KEY_NSCameraUsageDescription: "Pillownote uses the camera to attach photos to your pillow notes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pillownote lets you attach photos from your library to pillow notes."
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Pillownote sends reminders for daily questions and note arrivals."
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PillownoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PillownoteWidgets
      - path: Shared
    entitlements:
      path: PillownoteWidgets/PillownoteWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzoutuo.Pillownote
    info:
      path: PillownoteWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pillownote Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Pillownote.Widgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Pillownote:
    build:
      targets:
        Pillownote: all
        PillownoteWidgets: [compile]
    run:
      config: Debug
      storeKitConfiguration: Pillownote.storekit
